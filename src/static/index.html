<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query-ChatBot: Dynamic Text-to-SQL Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%);
            --glass-bg: rgba(17, 24, 39, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.15);
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --card-bg: rgba(31, 41, 55, 0.4);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #f3f4f6, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            position: relative;
        }

        .input-field {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            background: rgba(0, 0, 0, 0.3);
        }

        .results-section {
            display: none;
            flex-direction: column;
            gap: 2rem;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 2fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .answer-content {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #f3f4f6;
            white-space: pre-wrap;
        }

        .sql-container {
            position: relative;
        }

        .sql-code {
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 1.25rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #a5b4fc;
            line-height: 1.5;
        }

        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .metadata-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metadata-item:last-child {
            border-bottom: none;
        }

        .metadata-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .metadata-value {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            justify-content: flex-end;
            max-width: 70%;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .badge-alt {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Database Table Rendering */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 0.5rem;
            border: 1px solid var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Spinner */
        .loader {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 3rem 0;
        }

        .spinner {
            width: 3rem;
            height: 3rem;
            border: 3px solid rgba(99, 102, 241, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: none;
            animation: slideIn 0.3s ease-out;
            z-index: 100;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">Q</div>
            <div class="logo-text">
                <h1>Query-ChatBot</h1>
                <p>Dynamic Schema Text-to-SQL System</p>
            </div>
        </div>
        <div>
            <button class="btn btn-secondary" id="sync-btn" onclick="syncSchema()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                Sync Schema
            </button>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <div class="input-group">
                <input type="text" class="input-field" id="query-input" placeholder="Ask your database something... (e.g., Show me all active users)" onkeydown="if(event.key === 'Enter') sendQuery()">
                <button class="btn btn-primary" onclick="sendQuery()">
                    Execute
                </svg>
                </button>
            </div>
        </section>

        <!-- Loader -->
        <div class="loader" id="loader">
            <div class="spinner"></div>
        </div>

        <!-- Output Result Panel -->
        <section class="results-section" id="results-panel">
            <div class="grid">
                <!-- Answer Card -->
                <div class="card">
                    <div class="card-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        Answer
                    </div>
                    <div class="answer-content" id="answer-box">
                        Answer text will load here.
                    </div>
                </div>

                <!-- Pipeline Telemetry -->
                <div class="card">
                    <div class="card-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                        Pipeline Details
                    </div>
                    
                    <div class="metadata-item">
                        <span class="metadata-label">Routed Tables</span>
                        <div class="badge-list" id="routed-badge-list">
                            <!-- Badges -->
                        </div>
                    </div>
                    
                    <div class="metadata-item">
                        <span class="metadata-label">Expanded Tables</span>
                        <div class="badge-list" id="expanded-badge-list">
                            <!-- Badges -->
                        </div>
                    </div>

                    <div class="metadata-item">
                        <span class="metadata-label">Rows Returned</span>
                        <span class="metadata-value" id="row-count-val">0</span>
                    </div>
                </div>
            </div>

            <!-- Database Data Table Card -->
            <div class="card">
                <div class="card-header" onclick="toggleDbRecords()" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; width: 100%; user-select: none;">
                    <div class="card-title" style="margin-bottom: 0;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
                        Database Records
                    </div>
                    <button id="db-records-toggle" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; transform: rotate(-90deg);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                </div>
                <div class="table-wrapper" id="table-container" style="display: none;">
                    <!-- Dynamic Table -->
                </div>
            </div>

            <!-- SQL Query Card -->
            <div class="card">
                <div class="card-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    Generated SQL Query
                </div>
                <div class="sql-container">
                    <button class="copy-btn" onclick="copySql()">Copy</button>
                    <pre class="sql-code" id="sql-box">SELECT * FROM users;</pre>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">Schema synced successfully!</div>

    <script>
        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
            if (show) {
                document.getElementById('results-panel').style.display = 'none';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        async function syncSchema() {
            const syncBtn = document.getElementById('sync-btn');
            syncBtn.disabled = true;
            syncBtn.innerText = "Syncing...";
            try {
                const response = await fetch('/api/preprocess', { method: 'POST' });
                const data = await response.json();
                if (response.ok) {
                    showToast("Database Schema Refreshed!");
                } else {
                    alert("Error: " + data.detail);
                }
            } catch (err) {
                alert("Connection failed: " + err.message);
            } finally {
                syncBtn.disabled = false;
                syncBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg> Sync Schema`;
            }
        }

        async function sendQuery() {
            const queryInput = document.getElementById('query-input');
            const query = queryInput.value.trim();
            if (!query) return;

            showLoader(true);

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                
                const data = await response.json();

                if (!response.ok) {
                    alert("Error processing query: " + (data.detail || "Unknown error"));
                    showLoader(false);
                    return;
                }

                // Render Results
                document.getElementById('answer-box').innerText = data.response || "No response generated.";
                document.getElementById('sql-box').innerText = data.sql || "-- No SQL statement generated.";
                document.getElementById('row-count-val').innerText = data.results ? data.results.length : 0;

                // Render Badges
                renderBadges('routed-badge-list', data.routed_tables || [], false);
                renderBadges('expanded-badge-list', data.expanded_tables || [], true);

                // Render Table
                renderTable(data.results || []);

                // Show panel
                showLoader(false);
                document.getElementById('results-panel').style.display = 'flex';

            } catch (err) {
                alert("Request failed: " + err.message);
                showLoader(false);
            }
        }

        function renderBadges(containerId, list, isAlt) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = '<span class="metadata-value">-</span>';
                return;
            }
            list.forEach(item => {
                const span = document.createElement('span');
                span.className = `badge ${isAlt ? 'badge-alt' : ''}`;
                span.innerText = item;
                container.appendChild(span);
            });
        }

        function renderTable(results) {
            const container = document.getElementById('table-container');
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = '<div style="padding: 1.5rem; text-align: center; color: var(--text-secondary);">No records returned</div>';
                return;
            }

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');

            // Header columns
            const headers = Object.keys(results[0]);
            const headerRow = document.createElement('tr');
            headers.forEach(h => {
                const th = document.createElement('th');
                th.innerText = h;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);

            // Data rows
            results.forEach(row => {
                const tr = document.createElement('tr');
                headers.forEach(h => {
                    const td = document.createElement('td');
                    td.innerText = row[h] !== null ? row[h] : 'NULL';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            container.appendChild(table);
        }

        function copySql() {
            const sqlText = document.getElementById('sql-box').innerText;
            navigator.clipboard.writeText(sqlText);
            showToast("SQL query copied to clipboard!");
        }

        function toggleDbRecords() {
            const container = document.getElementById('table-container');
            const toggleBtn = document.getElementById('db-records-toggle');
            if (container.style.display === 'none') {
                container.style.display = 'block';
                toggleBtn.style.transform = 'rotate(0deg)';
            } else {
                container.style.display = 'none';
                toggleBtn.style.transform = 'rotate(-90deg)';
            }
        }
    </script>
</body>
</html>
